services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: labtrack
      POSTGRES_PASSWORD: labtrack_dev_password
      POSTGRES_DB: labtrack
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U labtrack"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: development
      PORT: 5000
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: labtrack
      DB_USER: labtrack
      DB_PASSWORD: labtrack_dev_password
      JWT_SECRET: dev-secret-change-in-production
      CLIENT_URL: http://localhost:3000
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./server/src:/app/src
    command: npm run dev

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      VITE_API_URL: http://localhost:5000/api
    depends_on:
      - server
    volumes:
      - ./client/src:/app/src
    command: npm run dev

volumes:
  pgdata:
